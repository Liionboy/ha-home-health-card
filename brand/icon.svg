<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Heart shape -->
  <path d="M256 400 C256 400, 100 300, 100 200 C100 150, 140 120, 180 120 C210 120, 240 140, 256 165 C272 140, 302 120, 332 120 C372 120, 412 150, 412 200 C412 300, 256 400, 256 400Z"
        fill="url(#heart)" opacity="0.9"/>

  <!-- Heartbeat/pulse line -->
  <polyline points="80,256 160,256 190,200 220,310 256,220 290,280 320,256 432,256"
            fill="none" stroke="url(#pulse)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small cross/plus (medical) -->
  <rect x="360" y="100" width="40" height="80" rx="8" fill="#22c55e" opacity="0.8"/>
  <rect x="340" y="120" width="80" height="40" rx="8" fill="#22c55e" opacity="0.8"/>

  <!-- Status dots -->
  <circle cx="120" cy="400" r="16" fill="#ef4444"/>
  <circle cx="170" cy="400" r="16" fill="#f59e0b"/>
  <circle cx="220" cy="400" r="16" fill="#22c55e"/>
  <circle cx="270" cy="400" r="16" fill="#3b82f6"/>
</svg>
